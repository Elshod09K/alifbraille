<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 788" width="820" height="788" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="AlifBraille digital-to-physical workflow: type, export, check the ruler, heat, read by touch"><rect width="820" height="788" fill="#ffffff"/><rect x="20" y="20" width="780" height="132" rx="14" fill="#e8eef7" stroke="#17407a" stroke-width="2"/><rect x="20" y="20" width="8" height="132" rx="4" fill="#17407a"/><circle cx="64" cy="50" r="16" fill="#17407a"/><text x="64" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><text x="92" y="56" font-size="18" font-weight="700" fill="#1c1e24">Sighted teacher types Uzbek Latin text (web app)</text><circle cx="98" cy="79" r="3.5" fill="#17407a"/><text x="112" y="84" font-size="15" fill="#3a3d46">Instant transliteration, works offline</text><circle cx="98" cy="103" r="3.5" fill="#17407a"/><text x="112" y="108" font-size="15" fill="#3a3d46">Speech-synced check with cell highlighting</text><circle cx="98" cy="127" r="3.5" fill="#17407a"/><text x="112" y="132" font-size="15" fill="#3a3d46">Swell simulation previews margins and raised dots</text><line x1="410.0" y1="156" x2="410.0" y2="184" stroke="#6a6d76" stroke-width="3" stroke-linecap="round"/><path d="M400.0 182 L410.0 194 L420.0 182 Z" fill="#6a6d76"/><rect x="20" y="198" width="780" height="156" rx="14" fill="#e3f3f1" stroke="#138a7e" stroke-width="2"/><rect x="20" y="198" width="8" height="156" rx="4" fill="#138a7e"/><circle cx="64" cy="228" r="16" fill="#138a7e"/><text x="64" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><text x="92" y="234" font-size="18" font-weight="700" fill="#1c1e24">Exact-scale SVG export or browser print</text><circle cx="98" cy="257" r="3.5" fill="#138a7e"/><text x="112" y="262" font-size="15" fill="#3a3d46">Marburg Medium: 2.5 mm dot pitch, 0.75 mm dot radius</text><circle cx="98" cy="281" r="3.5" fill="#138a7e"/><text x="112" y="286" font-size="15" fill="#3a3d46">50 mm calibration ruler on every sheet</text><circle cx="98" cy="305" r="3.5" fill="#138a7e"/><text x="112" y="310" font-size="15" fill="#3a3d46">Tactile page header and Braille page numbers</text><circle cx="98" cy="329" r="3.5" fill="#138a7e"/><text x="112" y="334" font-size="15" fill="#3a3d46">Pure black dots only, no borders or stray ink</text><line x1="410.0" y1="358" x2="410.0" y2="386" stroke="#6a6d76" stroke-width="3" stroke-linecap="round"/><path d="M400.0 384 L410.0 396 L420.0 384 Z" fill="#6a6d76"/><rect x="20" y="400" width="780" height="108" rx="14" fill="#fbefd9" stroke="#c07d14" stroke-width="2"/><rect x="20" y="400" width="8" height="108" rx="4" fill="#c07d14"/><circle cx="64" cy="430" r="16" fill="#c07d14"/><text x="64" y="436" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><text x="92" y="436" font-size="18" font-weight="700" fill="#1c1e24">Teacher checks the 50 mm ruler on the printed swell paper</text><circle cx="98" cy="459" r="3.5" fill="#c07d14"/><text x="112" y="464" font-size="15" fill="#3a3d46">Catches hidden "Fit to page" printer scaling</text><circle cx="98" cy="483" r="3.5" fill="#c07d14"/><text x="112" y="488" font-size="15" fill="#3a3d46">Before any heat is applied</text><line x1="410.0" y1="512" x2="410.0" y2="540" stroke="#6a6d76" stroke-width="3" stroke-linecap="round"/><path d="M400.0 538 L410.0 550 L420.0 538 Z" fill="#6a6d76"/><rect x="20" y="554" width="780" height="84" rx="14" fill="#fbe9e2" stroke="#b4471f" stroke-width="2"/><rect x="20" y="554" width="8" height="84" rx="4" fill="#b4471f"/><circle cx="64" cy="584" r="16" fill="#b4471f"/><text x="64" y="590" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><text x="92" y="590" font-size="18" font-weight="700" fill="#1c1e24">Heat fuser (e.g. PIAF)</text><circle cx="98" cy="613" r="3.5" fill="#b4471f"/><text x="112" y="618" font-size="15" fill="#3a3d46">Black ink absorbs heat; capsules under the dots swell up</text><line x1="410.0" y1="642" x2="410.0" y2="670" stroke="#6a6d76" stroke-width="3" stroke-linecap="round"/><path d="M400.0 668 L410.0 680 L420.0 668 Z" fill="#6a6d76"/><rect x="20" y="684" width="780" height="84" rx="14" fill="#e8eef7" stroke="#0f2c57" stroke-width="2"/><rect x="20" y="684" width="8" height="84" rx="4" fill="#0f2c57"/><circle cx="64" cy="714" r="16" fill="#0f2c57"/><text x="64" y="720" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text><text x="92" y="720" font-size="18" font-weight="700" fill="#1c1e24">Blind student reads the sheet by touch</text><circle cx="98" cy="743" r="3.5" fill="#0f2c57"/><text x="112" y="748" font-size="15" fill="#3a3d46">Same Latin-script content as sighted classmates</text></svg>